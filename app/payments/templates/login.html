<!DOCTYPE html>
<html>

<head>
    <title>Login</title>

    <style>
        body{
            font-family: Arial;
            margin:40px;
        }

        input{
            display:block;
            margin:10px 0;
            padding:10px;
            width:300px;
        }

        button{
            padding:10px 20px;
        }

        #result{
            margin-top:20px;
            color:red;
        }
    </style>
</head>

<body>

<h2>Login</h2>

<input
    id="email"
    type="email"
    placeholder="Email"
/>

<input
    id="password"
    type="password"
    placeholder="Password"
/>

<button onclick="login()">
    Login
</button>

<div id="result"></div>

<script>

async function login(){

    const email=document.getElementById("email").value;
    const password=document.getElementById("password").value;

    const response=await fetch("/login",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            email:email,
            password:password
        })

    });

    const data=await response.json();

    if(response.ok){

        localStorage.setItem(
            "access_token",
            data.access_token
        );
        const token = localStorage.getItem("access_token");
        console.log(token);

        document.getElementById("result").innerHTML="Login Successful";

        window.location="/payment/checkout";

    }else{

        document.getElementById("result").innerHTML=data.detail;

    }

}

</script>

</body>

</html>
